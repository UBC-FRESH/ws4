[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ws4"
version = "0.0.1"
description = "WS4: Wood Supply Simulation System (Spatially explicit)"
authors = [{name = "FRESH Lab", email = "noreply@example.org"}]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Apache-2.0"}
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "pyogrio>=0.9", "shapely>=2.0", "rtree>=1.0"]
opt = ["numba>=0.59", "networkx>=3.2", "ray>=2.9"]

[project.scripts]
ws4 = "ws4.cli:app"
