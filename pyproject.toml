[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ws4"
version = "0.1.0"
description = "WS4: Wood Supply Simulation System (Spatially explicit)"
authors = [{name = "FRESH Lab", email = "noreply@example.org"}]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Apache-2.0"}
keywords = ["forestry", "forest estate model", "simulation", "optimization", "spatial"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "pyyaml>=6",
]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "pyogrio>=0.9", "shapely>=2.0", "rtree>=1.0"]
opt = ["numba>=0.59", "networkx>=3.2", "ray>=2.9", "scipy>=1.11", "threadpoolctl>=3.1"]

[project.urls]
Homepage = "https://github.com/UBC-FRESH/ws4"
Documentation = "https://ubc-fresh.github.io/ws4/"
Repository = "https://github.com/UBC-FRESH/ws4"
Issues = "https://github.com/UBC-FRESH/ws4/issues"

[project.scripts]
ws4 = "ws4.cli:app"

[tool.setuptools.packages.find]
include = ["ws4*"]

# Tool configuration for the green dashboard (scripts/dashboard.py). Each gate configured
# here is also a CI check and a pre-commit hook.

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["scripts", "tests", "ws4"]
extend-exclude = ["tmp", "_build", "docs/_build", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D", "ANN", "N", "PT", "SIM", "RUF", "C4"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"docs/conf.py" = ["D", "ANN", "N"]
# Typer options are declared as default arguments by design.
"ws4/cli.py" = ["B008"]
# The select-expression AST is a tuple tree of mixed node payloads; its node
# functions are dynamically typed by construction.
"ws4/io/expressions.py" = ["ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "scripts"
files = ["scripts", "tests", "docs/conf.py"]

[[tool.mypy.overrides]]
module = ["numpydoc", "numpydoc.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["threadpoolctl", "threadpoolctl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["geopandas", "geopandas.*", "shapely", "shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["scripts"]

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == "__main__":']
