name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  notebooks:
    name: Notebook outputs
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package, the opt extra and the notebook tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[opt]"
          python -m pip install nbclient ipykernel

      - name: Check that the example notebooks' outputs are current
        run: python scripts/check_notebooks.py

  clean-checkout:
    name: Clean-checkout contract
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package and dev requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[geo,opt]"
          python -m pip install -r requirements-dev.txt

      - name: Build a matrix and verify the period target table
        run: python -m pytest tests/test_clean_checkout.py --no-cov -q

  quality:
    name: Quality gates
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[geo,opt,carbon,lidar]"
          python -m pip install -r requirements-dev.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Types (mypy --strict)
        run: python -m mypy

      - name: Tests with coverage gate
        run: python -m pytest

      - name: Validate workflow surfaces
        run: python scripts/check_workflow.py

      - name: Install pandoc (nbsphinx renders the example notebooks)
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build docs with warnings as errors
        run: sphinx-build -b html docs _build/html -W

      - name: Audit public docstrings
        run: python scripts/doc_audit.py

  dashboard:
    name: Green dashboard summary
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[geo,opt,carbon,lidar]"
          python -m pip install -r requirements-dev.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch

      - name: Install pandoc (nbsphinx renders the example notebooks)
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Run the dashboard
        shell: bash
        run: |
          set +e
          mkdir -p runtime
          python scripts/dashboard.py --markdown --json runtime/dashboard.json > runtime/dashboard.md
          status=$?
          cat runtime/dashboard.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload the dashboard record
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dashboard-record
          path: runtime/dashboard.json

  pre-commit:
    name: Pre-commit parity
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[geo,opt,carbon,lidar]"
          python -m pip install -r requirements-dev.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch

      - name: Run every pre-commit hook
        run: pre-commit run --all-files --show-diff-on-failure
