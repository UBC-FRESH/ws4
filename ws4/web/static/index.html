<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WS4</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <header>
    <strong>WS4</strong>
    <label>Run <select id="run"></select></label>
    <label class="year">Year
      <input id="year" type="range" min="0" max="0" step="1" value="0">
      <output id="year-label">0</output>
    </label>
    <span id="status">loading…</span>
  </header>
  <main>
    <aside>
      <nav class="tabs">
        <button data-tab="legend" class="active">Legend</button>
        <button data-tab="targets">Targets</button>
        <button data-tab="reports">Reports</button>
      </nav>
      <section id="tab-legend">
        <h2>Layers</h2>
        <label><input type="checkbox" id="show-treated" checked> Treated in the year <b id="n-treated">0</b></label>
        <label><input type="checkbox" id="show-untreated" checked> Untreated <b id="n-untreated">0</b></label>
        <p class="hint">Click a block for its attributes. Wheel to zoom; drag to pan.</p>
        <div id="detail" class="detail"></div>
      </section>
      <section id="tab-targets" hidden>
        <h2>Targets</h2>
        <pre id="targets">no targets file is configured</pre>
      </section>
      <section id="tab-reports" hidden>
        <h2>Reports</h2>
        <ul id="reports"></ul>
      </section>
    </aside>
    <div id="map-wrap">
      <svg id="map" xmlns="http://www.w3.org/2000/svg"><g id="viewport"></g></svg>
      <div class="scale" id="scale"></div>
    </div>
  </main>
  <script type="module" src="static/app.js"></script>
</body>
</html>
