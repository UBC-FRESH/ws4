<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WS4</title>
  <link rel="stylesheet" href="static/style.css?v=20">
</head>
<body>
  <header>
    <strong>WS4</strong><span class="build">v20</span>
    <label>Skin <select id="skin"></select></label>
    <label>Run <select id="run"></select></label>
    <label class="year">Year
      <input id="year" type="range" min="0" max="0" step="1" value="0">
      <output id="year-label">0</output>
    </label>
    <span id="status">loading…</span>
  </header>
  <main>
    <aside id="sidebar">
      <nav class="tabs">
        <button data-tab="legend" class="active">Legend</button>
        <button data-tab="targets">Targets</button>
        <button data-tab="reports">Reports</button>
      </nav>
      <section id="tab-legend">
        <h2>Layers</h2>
        <label><input type="checkbox" id="show-treated" checked> <span class="swatch treated"></span> Treated in the year <b id="n-treated">0</b></label>
        <label><input type="checkbox" id="show-untreated" checked> <span class="swatch untreated"></span> Untreated <b id="n-untreated">0</b></label>
        <p class="hint">Click a block for its attributes. Wheel to zoom; drag to pan.</p>
        <div id="detail" class="detail"></div>
      </section>
      <section id="tab-targets" hidden>
        <h2>Targets</h2>
        <p id="targets-empty" class="hint">no targets file is configured</p>
        <div id="watch-panel" class="watch"></div>
        <div class="table-wrap"><table id="targets-table" hidden>
          <thead><tr><th>Account</th><th>Year</th><th>Min</th><th>Max</th><th>Min w</th><th>Max w</th></tr></thead>
          <tbody></tbody>
        </table></div>
        <button id="save-targets" hidden>Save targets</button>
        <div class="run-row">
          <label>Max iters <input id="run-iterations" type="number" value="0" min="0" step="1" title="0 = until stopped"></label>
          <label>Time <input id="run-time-limit" type="text" placeholder="HH:MM:SS" size="9"></label>
          <label>Years <input id="run-years" type="number" value="50" min="1" step="1"></label>
          <label>Seed <input id="run-seed" type="number" value="1" step="1"></label>
          <button id="start-run">▶ Play</button>
          <button id="stop-run" hidden>⏹ Stop</button>
        </div>
        <div id="run-panel" hidden>
          <span class="pulse"></span>
          <span id="run-detail">idle</span>
          <svg id="spark" width="140" height="26" aria-label="objective trajectory"></svg>
        </div>
        <p id="run-status" class="hint"></p>
        <p id="targets-status" class="hint"></p>
      </section>
      <section id="tab-reports" hidden>
        <h2>Reports</h2>
        <ul id="reports"></ul>
        <div id="report-preview"></div>
      </section>
    </aside>
    <div id="splitter" title="Drag to resize the panel"></div>
    <div id="map-wrap">
      <svg id="map" xmlns="http://www.w3.org/2000/svg"><g id="viewport"></g></svg>
      <div class="scale" id="scale"></div>
    </div>
  </main>
  <script type="module" src="static/app.js?v=20"></script>
</body>
</html>
